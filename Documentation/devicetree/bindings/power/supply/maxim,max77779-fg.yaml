%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,max77779-fg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77779 fuel gauge

maintainers:
  - Will <239688658+WoodenWillis@users.noreply.github.com>

description:
  ModelGauge m5 fuel gauge block of the Maxim MAX77779 PMIC, on its own
  I2C address.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: maxim,max77779-fg

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  shunt-resistor-micro-ohms:
    description: Value of the battery current sense resistor.

required:
  - compatible
  - reg
  - shunt-resistor-micro-ohms

unevaluatedProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      fuel-gauge@36 {
        compatible = "maxim,max77779-fg";
        reg = <0x36>;
        shunt-resistor-micro-ohms = <2000>;
      };
    };
