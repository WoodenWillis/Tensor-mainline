%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/google,zumapro-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G4 (zumapro) SoC clock controller

maintainers:
  - Will <239688658+WoodenWillis@users.noreply.github.com>

description: |
  The zumapro clock controller is made of several CMU units, each modeled as
  a separate device tree node. The root clock is OSCCLK (24.576 MHz), which
  must be described as a fixed-rate clock. CMU_TOP derives the base clocks
  from PLLs and dividers and feeds the other CMUs.

  Clock identifiers are defined in 'dt-bindings/clock/google,zumapro.h'.

properties:
  compatible:
    enum:
      - google,zumapro-cmu-top
      - google,zumapro-cmu-g3d
      - google,zumapro-cmu-hsi0
      - google,zumapro-cmu-hsi2
      - google,zumapro-cmu-misc
      - google,zumapro-cmu-peric0

  clocks:
    minItems: 1
    maxItems: 7

  clock-names:
    minItems: 1
    maxItems: 7

  "#clock-cells":
    const: 1

  reg:
    maxItems: 1

required:
  - compatible
  - "#clock-cells"
  - clocks
  - clock-names
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: google,zumapro-cmu-top
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)

        clock-names:
          items:
            - const: oscclk

  - if:
      properties:
        compatible:
          contains:
            const: google,zumapro-cmu-g3d
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: G3D global clock (from CMU_TOP)
            - description: G3D NOC data clock (from CMU_TOP)
            - description: G3D switch clock (from CMU_TOP)
            - description: G3D trace clock (from CMU_TOP)
            - description: G3D core DVFS clock (from ACPM)
            - description: G3D L2 DVFS clock (from ACPM)

        clock-names:
          items:
            - const: oscclk
            - const: glb
            - const: nocd
            - const: switch
            - const: trace
            - const: g3d
            - const: g3dl2

  - if:
      properties:
        compatible:
          contains:
            const: google,zumapro-cmu-hsi0
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: HSI0 NOC clock (from CMU_TOP)
            - description: HSI0 peripheral clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: noc
            - const: peri

  - if:
      properties:
        compatible:
          contains:
            const: google,zumapro-cmu-hsi2
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: HSI2 NOC clock (from CMU_TOP)
            - description: HSI2 embedded UFS clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: noc
            - const: ufs_embd

  - if:
      properties:
        compatible:
          contains:
            const: google,zumapro-cmu-misc
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: MISC NOC clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: bus

  - if:
      properties:
        compatible:
          contains:
            const: google,zumapro-cmu-peric0
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: PERIC0 NOC clock (from CMU_TOP)
            - description: PERIC0 IP clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: noc
            - const: ip

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,zumapro.h>

    clock-controller@10800000 {
        compatible = "google,zumapro-cmu-peric0";
        reg = <0x10800000 0x8000>;
        #clock-cells = <1>;
        clocks = <&ext_24_5m>,
                 <&cmu_top CLK_DOUT_CMU_PERIC0_NOC>,
                 <&cmu_top CLK_DOUT_CMU_PERIC0_IP>;
        clock-names = "oscclk", "noc", "ip";
    };

...
