%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/synaptics,s3908.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics TouchComm SPI touchscreen controller

description:
  Synaptics touchscreen controllers that speak the TouchComm protocol
  over SPI, such as the S3908 in the Google Pixel 9 Pro.

maintainers:
  - Will <239688658+WoodenWillis@users.noreply.github.com>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: synaptics,s3908

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: Digital power supply regulator on the VDD pin

  avdd-supply:
    description: Analog power supply regulator on the AVDD pin

  spi-max-frequency: true
  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-size-x: true
  touchscreen-size-y: true
  touchscreen-swapped-x-y: true

additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - vdd-supply
  - avdd-supply

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>
    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      touchscreen@0 {
        compatible = "synaptics,s3908";
        reg = <0>;
        interrupt-parent = <&gpn0>;
        interrupts = <0 IRQ_TYPE_LEVEL_LOW>;
        reset-gpios = <&gpp1 1 GPIO_ACTIVE_LOW>;
        vdd-supply = <&ts_dvdd>;
        avdd-supply = <&ts_avdd>;
        spi-max-frequency = <1000000>;
      };
    };

...
